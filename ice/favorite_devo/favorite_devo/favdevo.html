<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <!-- Add your devotional content here -->
         <table>
            <tr>
              <th>Speaker</th>
              <th>Title</th>
              <th>Location</th>
              <th>Year</th>
            </tr>
            <tr>
              <td>Elder James O. Fantone</td>
              <td>The Battle is the Lord's</td>
              <td>Rexburg</td>
              <td>2026</td>
            </tr>
            <tr>
              <td>Rob Garrett</td>
              <td>He Will Make More of You</td>
              <td>Rexburg</td>
              <td>2026</td>
            </tr>
            <tr>
              <td>President Alvin F. Meredith III</td>
              <td>The Mission of BYU-Idaho</td>
              <td>Rexburg</td>
              <td>2026</td>
            </tr>
         </table>

         <form action="">
          <input type="text" name="Speaker" id="speaker-in">
          <label for="speaker-in"></label>
          <input type="text" name="Title" id="title-in">
          <input type="text" name="Location" id="location-in">
          <input type="date" name="Year" id="year-in">
         </form>
      </div>
    </main>
  </div>
</body>
</html>
